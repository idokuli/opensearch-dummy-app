---

_meta:
  type: "rolesmapping"
  config_version: 2

all_access:
  reserved: false
  backend_roles:
  - "admin"
  - "Administrator"
  description: "Maps admin to all_access"

own_index:
  reserved: false
  users:
  - "*"
  description: "Allow full access to an index named like the username"

kibana_user:
  reserved: false
  backend_roles:
  - "*"
  description: "Maps kibanauser to kibana_user"

readall:
  reserved: false
  backend_roles:
  - "*"

manage_snapshots:
  reserved: false
  backend_roles:
  - "*"

kibana_server:
  reserved: true
  users:
  - "*"
