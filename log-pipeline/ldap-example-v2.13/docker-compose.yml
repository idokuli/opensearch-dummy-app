version: '3'
services:
  opensearch-node1:
    env_file:
      - .env
    image: opensearchproject/opensearch:2.13.0
    container_name: opensearch-node1
    dns:
      - 8.8.8.8
      - 8.8.4.4
    security_opt:
      - seccomp:unconfined
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - network.publish_host= <host_ip>
      - discovery.seed_hosts= <host1_ip>, <host2_ip>, <host3_ip>
      - cluster.initial_master_nodes=<host1_node.name>, <host2_node.name>, <host3_node.name>
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD= $OPENSEARCH_INITIAL_ADMIN_PASSWORD #From .env file
      - plugins.security.ssl.http.enabled=false #Disable SSL for HTTP
      - plugins.security.disabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536 # maximum number of open files for the OpenSearch user, set to at least 65536 on modern systems
        hard: 65536
    volumes:
      - path/to/data_dir/opensearch-data1:/usr/share/opensearch/data
      - path/to/config.yml:/usr/share/opensearch/config/opensearch-security/config.yml
      - path/to/internal_users.yml:/usr/share/opensearch/config/opensearch-security/internal_users.yml
      - path/to/roles_mapping.yml:/usr/share/opensearch/config/opensearch-security/roles_mapping.yml

    ports:
      - 9200:9200
      - 9600:9600 # required for Performance Analyzer
      - 9300:9300 # required for internal communication between nodes
  
  opensearch-dashboard:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: opensearch-dashboard
    dns:
      - 8.8.8.8
      - 8.8.4.4
    security_opt:
      - seccomp:unconfined
    environment:
      - OPENSEARCH_HOSTS=["<host1_ip>:9200", "<host2_ip>:9200", "<host3_ip>:9200"]
      - SERVER_NAME=opensearch-dashboard
      - SERVER_HOST=0.0.0.0
    ports:
      - 5601:5601
    depends_on:
      - <container_name_of_opensearch-node1>